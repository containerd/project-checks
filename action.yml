# containerd project checks Github CI Action.
#
# Example:
#
# jobs:
#  project:
#    name: Project Checks
#    runs-on: ubuntu-latest
#    timeout-minutes: 5
#
#    steps:
#      - uses: actions/checkout@v7
#        with:
#          fetch-depth: 100
#
#      - uses: actions/setup-go@v7
#        with:
#          go-version: stable
#
#      - name: Project checks
#        uses: containerd/project-checks@v1.2.3
#
name: Project Checks
description: Project checks commonly used across containerd org
inputs:
  working-directory:
    required: false
    default: .
    description: Go project path to run checks in
  go-mod-tidy-flags:
    required: false
    description: go mod tidy flags, such as -compat=1.17
  repo-access-token:
    required: false
    description: "Deprecated: no longer used"
    deprecationMessage: "repo-access-token is no longer needed and is ignored"
  go-licenses-ignore:
    required: false
    description: list of go modules to bypass the go-licenses checks. Do not set this, except when go-licenses hits a false positive.
runs:
  using: composite
  steps:
    - name: Set env
      shell: bash
      run: echo "${RUNNER_TEMP}/project-checks/bin" >> "$GITHUB_PATH"

    - name: Install dependencies
      shell: bash
      env:
        GOBIN: ${{ runner.temp }}/project-checks/bin
        GO111MODULE: on
      run: |
        echo "::group::🚧 Get dependencies"
        go install -v github.com/vbatts/git-validation@latest
        go install -v github.com/containerd/ltag@latest
        go install -v github.com/google/go-licenses@latest
        echo "::endgroup::"

    - name: DCO Checks
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DCO_VERBOSITY: "-v"
        DCO_RANGE: ""
      run: |
        echo "::group::👮 DCO checks"
        set -x
        if jq -e '.pull_request' "${GITHUB_EVENT_PATH}" >/dev/null; then
          DCO_RANGE=$(jq -r '.pull_request.base.sha + ".." + .pull_request.head.sha' "${GITHUB_EVENT_PATH}")
        elif jq -e '.merge_group' "${GITHUB_EVENT_PATH}" >/dev/null; then
          # merge_group payloads record the base commit in .merge_group.base_sha
          # and do not have .before or .commits fields.
          DCO_RANGE=$(jq -r '.merge_group.base_sha + "..HEAD"' "${GITHUB_EVENT_PATH}")
        else
          # On push events, use .before..HEAD when .before is present in the
          # checkout. For new branches (.before is all zeros) or force-pushes
          # where .before is unreachable in a shallow clone, fall back to the
          # parent of the first pushed commit.
          BEFORE_SHA=$(jq -r '.before // empty' "${GITHUB_EVENT_PATH}")
          if [ -n "${BEFORE_SHA}" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            DCO_RANGE="${BEFORE_SHA}..HEAD"
          elif FIRST_COMMIT=$(jq -r '.commits[0].id // empty' "${GITHUB_EVENT_PATH}") && [ -n "${FIRST_COMMIT}" ] && git cat-file -e "${FIRST_COMMIT}~1^{commit}" 2>/dev/null; then
            DCO_RANGE="${FIRST_COMMIT}~1..HEAD"
          fi
        fi
        ${{ github.action_path }}/script/validate/dco
        echo "::endgroup::"
    
      # the allow list corresponds to https://github.com/cncf/foundation/blob/e5db022a0009f4db52b89d9875640cf3137153fe/allowed-third-party-license-policy.md
    - name: Check licenses
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GO_LICENSES_IGNORE: ${{ inputs.go-licenses-ignore }}
      run: |
        set -eux
        flags=
        for f in ${GO_LICENSES_IGNORE}; do
          flags="${flags} --ignore ${f}"
        done
        go-licenses check --include_tests ./... --allowed_licenses=Apache-2.0,BSD-2-Clause,BSD-2-Clause-FreeBSD,BSD-3-Clause,MIT,ISC,Python-2.0,PostgreSQL,X11,Zlib ${flags}

    - name: Validate file headers
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "::group::📚 File headers"
        ${{ github.action_path }}/script/validate/fileheader ${{ github.action_path }}/
        echo "::endgroup::"

    - name: Validate vendor directory
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        export GO_MOD_TIDY_FLAGS="${{ inputs.go-mod-tidy-flags }}"
        echo "::group::🚀 Vendor directory"
        ${{ github.action_path }}/script/validate/vendor
        echo "::endgroup::"
